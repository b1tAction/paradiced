# ========== Buff Definitions ==========

buffs:
  curse:
    evaluation: bad
    english_name: Curse
    name: 诅咒
    desc: 接下来3回合保持LP-1状态
    duration: 3
  lost:
    evaluation: mild_bad
    english_name: Lost
    name: 迷途
    desc: 下1回合朝反方向移动
    duration: 1
  corrupt:
    evaluation: bad
    english_name: Corrupt
    name: 腐化
    desc: 接下来4回合每2回合HP-1
    duration: 4
  poison:
    evaluation: very_bad
    english_name: Poison
    name: 毒瘴
    desc: 接下来3回合每回合受一次恶性随机事件影响
    duration: 3
  hidden:
    evaluation: neutral
    english_name: Hidden
    name: 隐匿
    desc: 接下来3回合免疫任意事件、BUFF或道具的影响
    duration: 3
  thorns:
    evaluation: neutral
    english_name: Thorns
    name: 反刺
    desc: Boss给自己施加反刺，玩家攻击Boss时受到30%反伤
    duration: 2
  divine:
    evaluation: very_good
    english_name: Divine
    name: 神眷
    desc: 接下来3回合保持LP+1状态
    duration: 3
  rain:
    evaluation: good
    english_name: Rain
    name: 甘霖
    desc: 接下来4回合每2回合HP+1
    duration: 4
  exorcism:
    evaluation: mild_good
    english_name: Exorcism
    name: 辟邪
    desc: 接下来5回合无视毒瘴buff
    duration: 5
  fire:
    evaluation: good
    english_name: Fire
    name: 离火
    desc: 朱雀阵营增益，每4回合LP+1
    duration: -1    # Permanent
  death_mark:
    evaluation: very_bad
    english_name: DeathMark
    name: 死亡标记
    desc: 死亡后阻止后续行动
    duration: 1

# ========== Item Definitions ==========

items:
  reverse_clock:
    evaluation: good
    english_name: ReverseClock
    name: 反方向的钟
    desc: 给予指定玩家迷途Buff
  any_door:
    evaluation: neutral
    english_name: AnyDoor
    name: 任意门
    desc: 前往指定玩家身边
  dice_upgrade:
    evaluation: good
    english_name: DiceUpgrade
    name: 骰子升级卡
    desc: 将当前骰子升级为更高等级