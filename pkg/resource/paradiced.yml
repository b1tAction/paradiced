# Paradiced - Game Definitions
# Event/Item/Buff static metadata loaded at startup via go:embed.
# Handler logic (EventHandlerConfig, BuffHandlerConfig, ItemHandlerConfig) stays in Go.

# ========== Event Definitions ==========

events:
  herb: # bingo
    evaluation: mild_good    # Supports named constants (mild_good=70) and raw numbers
    english_name: Herb
    name: 采集到草药
    desc: 在路边发现了草药，恢复了体力
  lucky_bubble: # bingo
    evaluation: good
    english_name: LuckyBubble
    name: 吹出幸运泡泡
    desc: 梦幻泡泡飘到你面前，藏着好运
  relic: # bingo
    evaluation: very_good
    english_name: Relic
    name: 捡到勇士的圣遗物
    desc: 发现了古老圣遗物，获得一次道具抽奖机会
  divine_bless: # bingo
    evaluation: excellent
    english_name: DivineBless
    name: 受到天使眷顾
    desc: 天使的祝福降临，获得神眷Buff
  exchange: # noneed
    evaluation: neutral
    english_name: Exchange
    name: 交换
    desc: 命运之手将你与另一位玩家交换位置
  hidden_buff: # bingo
    evaluation: good
    english_name: HiddenBuff
    name: 隐匿
    desc: 遁入异次元空间，获得隐匿Buff
  taste_test:
    evaluation: mixed
    english_name: TasteTest
    name: 这是什么？尝一口
    desc: 发现神秘物质，尝试后获得随机效果
  mosquito: # bingo
    evaluation: mild_bad
    english_name: Mosquito
    name: 被蚊虫叮咬
    desc: 丛林中的“蚊虫”叮咬了你
  ghost_hit: # bingo
    evaluation: mild_bad
    english_name: GhostHit
    name: 偶遇孤魂野鬼
    desc: 你被野鬼打了一闷棍
  dog_poop:
    evaluation: mild_bad
    english_name: DogPoop
    name: 踩到了狗屎
    desc: 运气糟糕的一天
  wind_gust: # bingo
    evaluation: bad
    english_name: WindGust
    name: 一阵风
    desc: 一阵狂风卷走了你的道具
  skull_gaze: # bingo
    evaluation: bad
    english_name: SkullGaze
    name: 恶魔之眼
    desc: 你注视了恶魔的眼睛，获得诅咒Buff
  lost_way: # bingo
    evaluation: mild_bad
    english_name: LostWay
    name: 迷途
    desc: 迷失方向，获得迷途Buff
  thunder: # bingo
    evaluation: very_bad
    english_name: Thunder
    name: 雷劫
    desc: 天雷降临，HP归零
  # TODO: 添加抽取任意Buff的事件

# ========== Buff Definitions ==========

buffs:
  curse:
    evaluation: bad
    english_name: Curse
    name: 诅咒
    desc: 接下来3回合保持LP-1状态
    duration: 3
  lost:
    evaluation: mild_bad
    english_name: Lost
    name: 迷途
    desc: 下1回合朝反方向移动
    duration: 1
  corrupt:
    evaluation: bad
    english_name: Corrupt
    name: 腐化
    desc: 接下来4回合每2回合HP-1
    duration: 4
  poison:
    evaluation: very_bad
    english_name: Poison
    name: 毒瘴
    desc: 接下来3回合每回合受一次恶性随机事件影响
    duration: 3
  hidden:
    evaluation: neutral
    english_name: Hidden
    name: 隐匿
    desc: 接下来1回合免疫任意事件、道具的影响
    duration: 1
  thorns:
    evaluation: neutral
    english_name: Thorns
    name: 反刺
    desc: 收到伤害后，反伤30%给攻击者
    duration: 2
  divine:
    evaluation: very_good
    english_name: Divine
    name: 神眷
    desc: 接下来3回合保持LP+1状态
    duration: 3
  rain:
    evaluation: good
    english_name: Rain
    name: 甘霖
    desc: 接下来4回合每2回合HP+1
    duration: 4
  exorcism:
    evaluation: mild_good
    english_name: Exorcism
    name: 辟邪
    desc: 接下来5回合无视毒瘴buff
    duration: 5
  fire:
    evaluation: good
    english_name: Fire
    name: 离火
    desc: 朱雀阵营增益，每4回合LP+1
    duration: -1    # Permanent
  death_mark:
    evaluation: very_bad
    english_name: DeathMark
    name: 死亡标记
    desc: 死亡后阻止后续行动
    duration: 1
  dominance:
    evaluation: very_good
    english_name: Dominance
    name: 威势
    desc: 青龙阵营增益，增益效果翻倍
    duration: 1
  rob_luck:
    evaluation: mild_bad
    english_name: RobLuck
    name: 劫运
    desc: 白虎阵营增益，抢夺目标好运
    duration: 1
    hidden: true
  suppress:
    evaluation: good
    english_name: Suppress
    name: 鎮厄
    desc: 玄武阵营增益，1回合免疫恶性事件和负面Buff
    duration: 1

# ========== Item Definitions ==========

items:
  reverse_clock:
    evaluation: good
    english_name: ReverseClock
    name: 反方向的钟
    desc: 给予指定玩家迷途Buff
  any_door:
    evaluation: neutral
    english_name: AnyDoor
    name: 任意门
    desc: 前往指定玩家身边
  dice_upgrade:
    evaluation: good
    english_name: DiceUpgrade
    name: 骰子升级卡
    desc: 将当前骰子升级为更高等级
  # TODO: 添加更多道具
  # 名刀司命(抵挡一次致命伤害)
  # 贤者的庇护(原地复活，不回到检查点)
  # 贪、嗔、痴之戒(永久改变自己的属性与属性上限)

# ========== Faction Definitions ==========

factions:
  qing_long:
    english_name: QingLong
    name: 青龙
    skill_name: 威势
    skill_desc: 每2回合获得充能，使用后1回合内增益效果翻倍(威势)
  zhu_que:
    english_name: ZhuQue
    name: 朱雀
    skill_name: 离火
    skill_desc: 每3回合幸运值+1，最高不超过8点
  bai_hu:
    english_name: BaiHu
    name: 白虎
    skill_name: 劫运
    skill_desc: 每2回合获得充能，指定目标玩家，使其增益效果改向自身(劫运)
  xuan_wu:
    english_name: XuanWu
    name: 玄武
    skill_name: 鎮厄
    skill_desc: 每2回合获得充能，使用后1回合免疫恶性事件和负面Buff(鎮厄)

# ========== Dice Definitions ==========

dice:
  gold:
    english_name: Gold
    name: 金骰子
    desc: 大幅提升大数概率 (1-2:10%, 3-4:20%, 5-6:70%)
    rank: 1
  silver:
    english_name: Silver
    name: 银骰子
    desc: 提升大数概率 (1-2:20%, 3-4:30%, 5-6:50%)
    rank: 2
  copper:
    english_name: Copper
    name: 铜骰子
    desc: 略微提升大数概率 (1-2:30%, 3-4:30%, 5-6:40%)
    rank: 3
  wood:
    english_name: Wood
    name: 木骰子
    desc: 均匀分布 (1-6各16.67%)
    rank: 4
  normal:
    english_name: Normal
    name: 普通骰子
    desc: 均匀分布 (1-6各16.67%)
    rank: 0

# ========== Mini Game Definitions ==========

mini_games:
  dice_race:
    mode: frontend            # frontend or online
    available: true            # Whether available for random selection pool
    english_name: DiceRace
    name: 骰子竞速
    desc: 掷骰子比大小，按分数排名
  coin_flip:
    mode: frontend
    available: false           # Not yet implemented, excluded from pool
    english_name: CoinFlip
    name: 翻硬币
    desc: 翻硬币比运气
  count_seconds:
    mode: frontend
    available: true
    english_name: CountSeconds
    name: 数秒
    desc: 尽可能准确地数出5秒
  math_calc:
    mode: frontend
    available: true
    english_name: MathCalc
    name: 心算挑战
    desc: 心算数学题，比准确率和速度
  rainbow_memory:
    mode: frontend
    available: true
    english_name: RainbowMemory
    name: 彩虹记忆
    desc: 记忆彩虹颜色顺序
  vernier:
    mode: frontend
    available: true
    english_name: Vernier
    name: 游标卡尺
    desc: 精确读取游标卡尺刻度
  dilemma_race:
    mode: online               # Requires Colyseus mini-game service
    available: true
    english_name: DilemmaRace
    name: 博弈论竞速
    desc: 选择步数博弈，相同步数则互相阻挡