    name: 智慧玄戒
    desc: 获得神眷Buff
    triggerable: true
    targetable: false
  meditation_ring:
    evaluation: good
    english_name: MeditationRing
    name: 禅定玄戒
    desc: 获得甘霖Buff
    triggerable: true
    targetable: false
  discipline_ring:
    evaluation: good
    english_name: DisciplineRing
    name: 持戒玄戒
    desc: 获得金身Buff
    triggerable: true
    targetable: false
  foolish_ring:
    evaluation: mixed
    english_name: FoolishRing
    name: 痴愚煞戒
    desc: HP+1，LP-1
    triggerable: true
    targetable: false
  greedy_ring:
    evaluation: mixed
    english_name: GreedyRing
    name: 贪婪煞戒
    desc: LP+1，HP-1
    triggerable: true
    targetable: false
  wrath_ring:
    evaluation: mild_bad
    english_name: WrathRing
    name: 嗔恨煞戒
    desc: HP-1，获得嗔怒Buff
    triggerable: true
    targetable: false
  named_blade:
    evaluation: very_good
    english_name: NamedBlade
    name: 名刀司命
    desc: 抵挡一次致命伤害
    triggerable: false
    targetable: false
  sage_protection:
    evaluation: good
    english_name: SageProtection
    name: 贤者的庇护
    desc: 原地复活
    triggerable: false
    targetable: false

# ========== Faction Definitions ==========

factions:
  qing_long:
    english_name: QingLong
    name: 青龙
    skill_name: 威势
    skill_desc: 每2回合获得充能，使用后1回合内增益效果翻倍(威势)
  zhu_que:
    english_name: ZhuQue
    name: 朱雀
    skill_name: 离火
    skill_desc: 每3回合幸运值+1，最高不超过8点
  bai_hu:
    english_name: BaiHu
    name: 白虎
    skill_name: 劫运
    skill_desc: 每2回合获得充能，指定目标玩家，使其增益效果改向自身(劫运)
  xuan_wu:
    english_name: XuanWu
    name: 玄武
    skill_name: 鎮厄
    skill_desc: 每2回合获得充能，使用后1回合免疫恶性事件和负面Buff(鎮厄)

# ========== Dice Definitions ==========

dice:
  gold:
    english_name: Gold
    name: 金骰子
    desc: 大幅提升大数概率 (1-2:10%, 3-4:20%, 5-6:70%)
    rank: 1
  silver:
    english_name: Silver
    name: 银骰子
    desc: 提升大数概率 (1-2:20%, 3-4:30%, 5-6:50%)
    rank: 2
  copper:
    english_name: Copper
    name: 铜骰子
    desc: 略微提升大数概率 (1-2:30%, 3-4:30%, 5-6:40%)
    rank: 3
  wood:
    english_name: Wood
    name: 木骰子
    desc: 均匀分布 (1-6各16.67%)
    rank: 4
  normal:
    english_name: Normal
    name: 普通骰子
    desc: 均匀分布 (1-6各16.67%)
    rank: 0

# ========== Mini Game Definitions ==========

mini_games:
  dice_race:
    mode: frontend            # frontend or online
    available: true            # Whether available for random selection pool
    english_name: DiceRace
    name: 骰子竞速
    desc: 掷骰子比大小，按分数排名
  coin_flip:
    mode: frontend
    available: false           # Not yet implemented, excluded from pool
    english_name: CoinFlip
    name: 翻硬币
    desc: 翻硬币比运气
  count_seconds:
    mode: frontend
    available: true
    english_name: CountSeconds
    name: 数秒
    desc: 尽可能准确地数出5秒
  math_calc:
    mode: frontend
    available: true
    english_name: MathCalc
    name: 心算挑战
    desc: 心算数学题，比准确率和速度
  rainbow_memory:
    mode: frontend
    available: true
    english_name: RainbowMemory
    name: 彩虹记忆
    desc: 记忆彩虹颜色顺序
  vernier:
    mode: frontend
    available: true
    english_name: Vernier
    name: 游标卡尺
    desc: 精确读取游标卡尺刻度
  dilemma_race:
    mode: online               # Requires Colyseus mini-game service
    available: true
    english_name: StepCollision
    name: 步步为营
    desc: 猜测对手步数，选出唯一数字即可前行，撞车则原地不动！
  trust_dilemma:
    mode: online               # Requires Colyseus mini-game service
    available: true
    english_name: TrustTest
    name: 信任考验
    desc: 经典多玩家囚徒困境，选择合作还是背叛？共赢还是掠夺由你决定！
  cake_cutting:
    mode: online               # Requires Colyseus mini-game service
    available: true
    english_name: CakeCutting
    name: 切蛋糕
    desc: 轮流切蛋糕，保留较小一部分，切不中则出局，存活至最后获胜
  typing_speed:
    mode: online               # Requires Colyseus mini-game service
    available: true
    english_name: TypingSpeed
    name: 打字速度
    desc: 快速输入屏幕上朱自清《春》的经典句子，字字必争！