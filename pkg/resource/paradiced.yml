# Paradiced - Game Definitions
# Event/Item/Buff static metadata loaded at startup via go:embed.
# Handler logic (EventHandlerConfig, BuffHandlerConfig, ItemHandlerConfig) stays in Go.

# ========== Event Definitions ==========

events:
  herb: # bingo
    evaluation: mild_good    # Supports named constants (mild_good=70) and raw numbers
    english_name: Herb
    name: 采集到草药
    desc: 在路边发现了草药，恢复了体力
  lucky_bubble: # bingo
    evaluation: good
    english_name: LuckyBubble
    name: 吹出幸运泡泡
    desc: 梦幻泡泡飘到你面前，藏着好运
  relic: # bingo
    evaluation: very_good
    english_name: Relic
    name: 捡到勇士的圣遗物
    desc: 发现了古老圣遗物，获得一次道具抽奖机会
  divine_bless: # bingo
    evaluation: excellent
    english_name: DivineBless
    name: 受到天使眷顾
    desc: 天使的祝福降临，获得神眷Buff
  exchange: # noneed
    evaluation: neutral
    english_name: Exchange
    name: 交换
    desc: 命运之手将你与另一位玩家交换位置
  hidden_buff: # bingo
    evaluation: good
    english_name: HiddenBuff
    name: 隐匿
    desc: 遁入异次元空间，获得隐匿Buff
  taste_test:
    evaluation: mixed
    english_name: TasteTest
    name: 这是什么？尝一口
    desc: 发现神秘物质，尝试后获得随机效果
  mosquito: # bingo
    evaluation: mild_bad
    english_name: Mosquito
    name: 被蚊虫叮咬
    desc: 丛林中的“蚊虫”叮咬了你
  ghost_hit: # bingo
    evaluation: mild_bad
    english_name: GhostHit
    name: 偶遇孤魂野鬼
    desc: 你被野鬼打了一闷棍
  dog_poop:
    evaluation: mild_bad
    english_name: DogPoop
    name: 踩到了狗屎
    desc: 运气糟糕的一天
  wind_gust: # bingo
    evaluation: bad
    english_name: WindGust
    name: 一阵风
    desc: 一阵狂风卷走了你的道具
  skull_gaze: # bingo
    evaluation: bad
    english_name: SkullGaze
    name: 恶魔之眼
    desc: 你注视了恶魔的眼睛，获得诅咒Buff
  lost_way: # bingo
    evaluation: mild_bad
    english_name: LostWay
    name: 迷途
    desc: 迷失方向，获得迷途Buff
  thunder: # bingo
    evaluation: very_bad
    english_name: Thunder
    name: 雷劫
    desc: 天雷降临，HP归零
  # TODO: 添加抽取任意Buff的事件

# ========== Buff Definitions ==========

buffs:
  curse:
    evaluation: bad
    english_name: Curse
    name: 诅咒
    desc: 接下来3回合保持LP-1状态
    duration: 3
  lost:
    evaluation: mild_bad
    english_name: Lost
    name: 迷途
    desc: 下1回合朝反方向移动
    duration: 1
  corrupt:
    evaluation: bad
    english_name: Corrupt
    name: 腐化
    desc: 接下来4回合每2回合HP-1
    duration: 4
  poison:
    evaluation: very_bad
    english_name: Poison
    name: 毒瘴
    desc: 接下来3回合每回合受一次恶性随机事件影响
    duration: 3
  hidden:
    evaluation: neutral
    english_name: Hidden
    name: 隐匿
    desc: 接下来1回合免疫任意事件、道具的影响
    duration: 1
  thorns:
    evaluation: neutral
    english_name: Thorns
    name: 反刺
    desc: 收到伤害后，反伤30%给攻击者
    duration: 2
  divine:
    evaluation: very_good
    english_name: Divine
    name: 神眷
    desc: 接下来3回合保持LP+1状态
    duration: 3
  rain:
    evaluation: good
    english_name: Rain
    name: 甘霖
    desc: 接下来4回合每2回合HP+1
    duration: 4
  exorcism:
    evaluation: mild_good
    english_name: Exorcism
    name: 辟邪
    desc: 接下来5回合无视毒瘴buff
    duration: 5
  fire:
    evaluation: good
    english_name: Fire
    name: 离火
    desc: 朱雀阵营增益，每4回合LP+1
    duration: -1    # Permanent
  death_mark:
    evaluation: very_bad
    english_name: DeathMark
    name: 死亡标记
    desc: 死亡后阻止后续行动
    duration: 1
  dominance:
    evaluation: very_good
    english_name: Dominance
    name: 威势
    desc: 青龙阵营增益，增益效果翻倍
    duration: 1
  rob_luck:
    evaluation: mild_bad
    english_name: RobLuck
    name: 劫运
    desc: 白虎阵营增益，抢夺目标好运
    duration: 1
    hidden: true
  suppress:
    evaluation: good
    english_name: Suppress
    name: 鎮厄
    desc: 玄武阵营增益，1回合免疫恶性事件和负面Buff
    duration: 1
  sinking:
    evaluation: bad
    english_name: Sinking
    name: 沉沦
    desc: 接下来2回合与某人共享恶性的Action
    duration: 2
    hidden: true    # Not drawable, only triggered by MagicFlute item
  eternal:
    evaluation: good
    english_name: Eternal
    name: 永恒
    desc: 接下来2回合与某人共享良性的Action
    duration: 2
    hidden: true    # Not drawable, only triggered by CupidArrow item
  fearless:
    evaluation: mild_bad
    english_name: Fearless
    name: 无畏
    desc: 血量立刻减至1点，3回合内血量保持不变
    duration: 3
  golden_body:
    evaluation: good
    english_name: GoldenBody
    name: 金身
    desc: 接下来2回合受到的伤害减半
    duration: 2
  wrath:
    evaluation: mild_good
    english_name: Wrath
    name: 嗔怒
    desc: 接下来2回合造成的伤害+1
    duration: 2
  savior:
    evaluation: neutral
    english_name: Savior
    name: 庇护
    desc: 抵挡一次致命伤害
    duration: -1
    hidden: true
  sage_protection:
    evaluation: neutral
    english_name: SageProtection
    name: 贤者的庇护
    desc: 原地复活，不回到检查点
    duration: -1
    hidden: true

# ========== Item Definitions ==========

items:
  reverse_clock:
    evaluation: good
    english_name: ReverseClock
