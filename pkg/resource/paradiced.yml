    desc: 给予指定玩家迷途Buff
    triggerable: true
    targetable: true
  any_door:
    evaluation: neutral
    english_name: AnyDoor
    name: 任意门
    desc: 前往指定玩家身边
    triggerable: true
    targetable: true
  dice_upgrade:
    evaluation: good
    english_name: DiceUpgrade
    name: 骰子升级卡
    desc: 将当前骰子升级为更高等级
    triggerable: true
    targetable: false
  magic_flute:
    evaluation: mild_bad
    english_name: MagicFlute
    name: 魔笛
    desc: 与某人共同获得沉沦Buff，共享恶性Action
