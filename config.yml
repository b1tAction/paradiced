# fated/devops/config.yml
name: fated-node-1
data_dir: "/nakama/data"

# Console configuration (web dashboard)
console:
  port: 7351 
  username: "admin"
  password: "password123"

# Database configuration
database:
  address: 
    - "root@cockroachdb:26257"
  conn_max_lifetime_ms: 3600000
  conn_max_idle: 10
  conn_max_open: 100

# Socket configuration (real-time communication)
socket:
  port: 7350
  max_message_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 10000
  ping_period_ms: 15000
  pong_wait_ms: 25000
  outgoing_queue_size: 64

# Session configuration
session:
  token_expiry_sec: 7200
  refresh_expiry_sec: 86400

# Runtime configuration (Go plugins)
runtime:
  path: "/nakama/modules" 

# Match configuration
match:
  join_attempt_timeout_ms: 15000
  
# Logging configuration
logger:
  level: "debug"
  format: "json"