version: '3'

services:
  cockroachdb:
    image: cockroachdb/cockroach:latest-v23.1
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: "no"
    volumes:
      - cockroach_data:/var/lib/cockroach
    expose:
      - "8080"
      - "26257"
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.22.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        mkdir -p /nakama/logs &&
        if [ -f /nakama/logs/nakama.log ] && [ -s /nakama/logs/nakama.log ]; then
          mv /nakama/logs/nakama.log "/nakama/logs/nakama.$$(date +%Y%m%d-%H%M%S).log";
        fi &&
        for f in $$(ls -1t /nakama/logs/nakama.*.log 2>/dev/null | sed -n '51,$$p'); do
          rm -f "$$f";
        done &&
        : > /nakama/logs/nakama.log &&
        /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
        /nakama/nakama --config /nakama/data/config.yml 2>&1 | tee /nakama/logs/nakama.log
    restart: "no"
    links:
      - "cockroachdb:db"
    depends_on:
      cockroachdb:
        condition: service_healthy
    volumes:
      - nakama_data:/nakama/data
      - ./modules:/nakama/modules
      - ./config.yml:/nakama/data/config.yml 
      - ./logs:/nakama/logs
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"   # RPC
      - "7350:7350"   # HTTP / WebSocket
      - "7351:7351"   # Nakama Console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Automated cron job for cleaning up stale device-authenticated accounts.
  # Runs cleanup_stale_accounts RPC every 24 hours via Nakama HTTP API.
  cron-cleanup:
    image: alpine:3.19
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        apk add --no-cache curl &&
        echo "Stale account cleanup cron started (every 24 hours)..." &&
        # Wait 60s for Nakama to be fully ready on first start
        sleep 60 &&
        while true; do
          echo "Running cleanup_stale_accounts RPC...";
          result=$$(curl -sf \
            "http://nakama:7350/v2/rpc/cleanup_stale_accounts?http_key=defaultkey&payload=%7B%7D") && \
          echo "Cleanup result: $$result" || \
          echo "Cleanup failed, will retry in 24 hours.";
          sleep 86400;
        done

volumes:
  cockroach_data:
  nakama_data: