version: '3.9'

services:
  cockroachdb:
    image: cockroachdb/cockroach:v23.1.11
    container_name: paradiced-cockroachdb
    command: start-single-node --insecure
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    ports:
      - "26257:26257"  # Database port
      - "8080:8080"    # Admin UI
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.19.0
    container_name: paradiced-nakama
    depends_on:
      cockroachdb:
        condition: service_healthy
    environment:
      NAKAMA_CONFIG: /nakama/config.yml
    volumes:
      # Plugin modules directory
      - ./modules:/nakama/modules
      # Configuration file
      - ./config.yml:/nakama/config.yml
      # Nakama data
      - nakama-data:/nakama/data
    ports:
      # API port (for client connections)
      - "7350:7350"
      # HTTP API port
      - "7351:7351"
      # gRPC port
      - "7349:7349"
      # Console port (web dashboard)
      - "7352:7352"
    command:
      - "/nakama/nakama"
      - "--config=/nakama/config.yml"
      - "--runtime.path=/nakama/modules"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7351/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cockroach-data:
    driver: local
  nakama-data:
    driver: local

networks:
  default:
    name: paradiced-network